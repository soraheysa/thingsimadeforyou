<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4B2A78">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Story">
  <script src="../shared/pwa.js"></script>
  <title>Hũ điều ước</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p class="preview-banner" id="preview-banner" hidden>Chế độ xem thử với dữ liệu giả. Không có gì được lưu lên mạng. <button class="link" id="btn-reset" type="button">Làm lại từ đầu</button></p>

  <header class="hero">
    <div class="hero-inner">
      <div class="bar">
        <a class="back" href="../" aria-label="Về trang chính">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          <span class="back-label">Những thứ anh làm cho em</span>
        </a>
        <button class="btn-new" id="btn-new" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Thêm điều ước</span>
        </button>
      </div>

      <div class="jar-row">
        <div class="jar" id="jar" aria-hidden="true"></div>
        <div class="jar-text">
          <h1 class="title">Hũ điều ước</h1>
          <p class="jar-line" id="jar-line">Đang mở nắp hũ…</p>
          <button class="btn-draw" id="btn-draw" type="button" disabled>Bốc một điều ước</button>
          <p class="jar-note" id="jar-note"></p>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="confirm-zone" id="confirm-zone" hidden aria-labelledby="confirm-zone-title">
      <h2 id="confirm-zone-title"></h2>
      <div class="cards" id="confirm-list"></div>
    </section>

    <div class="toolbar">
      <div class="seg" id="tabs" role="tablist" aria-label="Danh sách">
        <button type="button" role="tab" data-tab="wishes" aria-selected="true"><span data-label></span> <b class="count" data-count></b></button>
        <button type="button" role="tab" data-tab="todo" aria-selected="false"><span data-label></span> <b class="count" data-count></b></button>
      </div>
      <label class="sort">
        <span>Sắp xếp</span>
        <select id="sort"></select>
      </label>
    </div>

    <p class="tab-help" id="tab-help"></p>
    <div class="cards" id="list" role="tabpanel" aria-live="polite">
      <p class="empty">Đang tải…</p>
    </div>
  </main>

  <!-- Add / edit a wish -->
  <dialog class="sheet" id="dlg-compose" aria-labelledby="compose-title">
    <form id="form-compose" method="dialog" novalidate>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="compose-title">Thêm điều ước</h2>
        <button class="round" type="button" data-close aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>

      <fieldset class="cats" id="cats">
        <legend>Điều ước này dành cho</legend>
        <div class="cat-grid" id="cat-grid"></div>
        <p class="cat-help" id="cat-help"></p>
      </fieldset>

      <div class="field" id="field-recipient">
        <label for="in-recipient"><span>Cho ai?</span><span class="counter" data-counter="in-recipient"></span></label>
        <input id="in-recipient" type="text" autocomplete="off" placeholder="Ví dụ: Mẹ, bé Na, nhóm bạn thân">
      </div>
      <div class="field">
        <label for="in-title"><span>Điều ước</span><span class="counter" data-counter="in-title"></span></label>
        <input id="in-title" type="text" autocomplete="off" placeholder="Ví dụ: Một chuyến Đà Lạt chỉ hai đứa">
      </div>
      <div class="field">
        <label for="in-note"><span>Ghi chú <i>(không bắt buộc)</i></span><span class="counter" data-counter="in-note"></span></label>
        <textarea id="in-note" rows="3" placeholder="Màu gì, size nào, ở đâu, khi nào…"></textarea>
      </div>
      <div class="field">
        <label for="in-link"><span>Đường link <i>(không bắt buộc)</i></span></label>
        <input id="in-link" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…">
      </div>

      <p class="form-error" id="compose-error" role="alert"></p>
      <button class="btn-main" type="submit" id="btn-submit">Thả vào hũ</button>
    </form>
  </dialog>

  <!-- Drawing a wish -->
  <dialog class="draw" id="dlg-draw" aria-labelledby="draw-title">
    <h2 id="draw-title">Đang bốc…</h2>
    <div class="slip" id="slip">
      <div class="slip-face slip-back" aria-hidden="true"><span>✦</span></div>
      <div class="slip-face slip-front" id="slip-front"></div>
    </div>
    <p class="draw-text" id="draw-text"></p>
    <button class="btn-main" type="button" id="btn-draw-done" hidden></button>
  </dialog>

  <!-- Confirm -->
  <dialog class="confirm" id="dlg-confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button class="btn-soft" type="button" data-answer="no">Thôi</button>
      <button class="btn-main" type="button" data-answer="yes" id="confirm-yes"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/config.js"></script>
  <script src="../shared/mock.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="config.js"></script>
  <script src="rules.js"></script>
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
