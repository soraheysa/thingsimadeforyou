<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6D3E4">
  <title>Những thứ anh làm cho em</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="shared/hub.css">
</head>
<body>
  <div class="halves-bg" aria-hidden="true"></div>
  <div class="thread-bg" aria-hidden="true"></div>
  <p class="preview-banner" id="preview-banner" hidden>Chế độ xem thử với dữ liệu giả, mã nào cũng được. Đăng nhập bằng email có chữ “luan” để xem phía của Luân.</p>

  <main class="gate">
    <section class="card" data-screen="invite" hidden>
      <h1 id="invite-title"></h1>
      <p id="invite-text" class="lede"></p>
      <button class="btn" id="btn-accept" type="button"></button>
    </section>

    <section class="card" data-screen="email" hidden>
      <h1 id="email-title">Nhập email</h1>
      <p class="lede" id="email-lede"></p>
      <form id="form-email" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required spellcheck="false">
        <p class="form-error" id="email-error" role="alert"></p>
        <button class="btn" id="btn-email" type="submit">Gửi mã</button>
      </form>
    </section>

    <section class="card" data-screen="code" hidden>
      <h1>Kiểm tra hộp thư</h1>
      <p class="lede">Mã đang được gửi tới <b id="code-email"></b>. Tìm thư có tiêu đề “Mã của Hai nửa”. Có thể mất một phút, và đôi khi thư rơi vào mục Spam.</p>
      <form id="form-code" novalidate>
        <label for="code">Mã</label>
        <input id="code" name="code" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" required placeholder="xxx-xxx-xx">
        <p class="form-error" id="code-error" role="alert"></p>
        <button class="btn" type="submit">Mở</button>
      </form>
      <div class="gate-links">
        <button class="link" id="btn-resend" type="button">Gửi lại mã</button>
        <button class="link" id="btn-other-email" type="button">Dùng email khác</button>
      </div>
    </section>

    <section class="card" data-screen="home" hidden>
      <h1 id="home-title"></h1>
      <p class="lede" id="home-lede">Chạm vào một món để mở.</p>
      <ul class="things" id="things"></ul>
      <div class="home-foot"><button class="link" id="btn-signout" type="button">Đăng xuất</button></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="shared/config.js"></script>
  <script src="shared/mock.js"></script>
  <script src="shared/auth.js"></script>
  <script>
  (function () {
    'use strict';
    const C = window.SHARED_CONFIG;
    const A = window.Auth;
    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const next = A.safeNext(new URLSearchParams(location.search).get('next'));
    let pendingEmail = '';

    const ERRORS = {
      not_invited: 'Trang này chỉ mở cho hai địa chỉ email, và đây không phải một trong hai. Kiểm tra lại chính tả nhé.',
      cooldown: 'Mã vừa được gửi chưa tới một phút. Kiểm tra hộp thư và mục Spam trước đã.',
      no_pending: 'Yêu cầu mã này đã hết hạn. Gửi mã mới nhé.',
      wrong_code: 'Mã chưa đúng. Xem lại email rồi nhập lại.',
      too_many: 'Nhập sai quá nhiều lần. Đợi 30 phút rồi gửi mã mới.',
      network: 'Không kết nối được. Kiểm tra mạng rồi thử lại.',
      auth: 'Thiết bị này đã đăng xuất. Đăng nhập lại bằng email nhé.',
    };
    const errText = r => ERRORS[r.error] || r.message || 'Có lỗi xảy ra. Thử lại sau chút nữa.';

    let toastTimer;
    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function show(name) {
      $$('[data-screen]').forEach(s => { s.hidden = s.dataset.screen !== name; });
      const input = $(`[data-screen="${name}"] input`);
      if (input) setTimeout(() => input.focus(), 50);
    }

    function showEmail(message) {
      const saved = A.ls.get('email') || '';
      $('#email').value = saved;
      $('#email-title').textContent = saved ? 'Lại gặp nhau rồi' : 'Nhập email';
      $('#email-lede').textContent = saved
        ? 'Kiểm tra lại email rồi bấm Tiếp tục.'
        : 'Mã đăng nhập sẽ được gửi tới địa chỉ này. Mỗi thiết bị chỉ cần nhập mã một lần.';
      $('#btn-email').textContent = saved ? 'Tiếp tục' : 'Gửi mã';
      $('#email-error').textContent = message || '';
      show('email');
    }

    const STATUS = { building: 'Đang build', idea: 'Mới là ý tưởng' };
    let homeTimer = null;

    function renderThings() {
      $('#things').innerHTML = C.THINGS.map(t => {
        const wait = A.opensIn(t);
        if (wait || STATUS[t.status]) {
          const status = wait
            ? `Trò này chưa ra mắt. Mở sau <span data-opens="${esc(t.path)}">${A.countdownText(wait)}</span>`
            : STATUS[t.status];
          return `
            <li><div class="thing-locked" aria-disabled="true">
              <span class="thing-title">${esc(t.title)}</span>
              <span class="thing-text">${esc(t.text)}</span>
              <span class="thing-status">${status}</span>
            </div></li>`;
        }
        return `
          <li><a href="${esc(new URL(t.path, A.ROOT).pathname)}">
            <span class="thing-title">${esc(t.title)}</span>
            <span class="thing-text">${esc(t.text)}</span>
          </a></li>`;
      }).join('');
    }

    function tickThings() {
      let opened = false;
      $$('[data-opens]').forEach(el => {
        const ms = A.opensIn(A.thing(el.dataset.opens));
        if (ms) el.textContent = A.countdownText(ms); else opened = true;
      });
      if (opened) renderThings();   // a game just opened: turn it into a link
    }

    function showHome() {
      if (next) { location.replace(next); return; }
      const name = A.ls.get('name');
      const welcome = C.WELCOME && C.WELCOME[A.ls.get('side')];
      if (welcome) {
        $('#home-title').textContent = welcome.title;
        $('#home-lede').textContent = welcome.text;
        $('#home-lede').className = 'letter';
      } else {
        $('#home-title').textContent = name ? `Chào ${name}` : C.SERIES_NAME;
        $('#home-lede').textContent = name ? `${C.SERIES_NAME}. Chạm vào một món để mở.` : 'Chạm vào một món để mở.';
        $('#home-lede').className = 'lede';
      }
      renderThings();
      clearInterval(homeTimer);
      homeTimer = setInterval(tickThings, 1000);
      show('home');
    }

    async function submitEmail(e) {
      e.preventDefault();
      const email = $('#email').value.trim().toLowerCase();
      const errEl = $('#email-error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && !(A.DEMO && email)) {
        errEl.textContent = 'Nhập đầy đủ địa chỉ email, ví dụ ten@gmail.com.';
        return;
      }
      errEl.textContent = '';
      const btn = $('#btn-email');
      btn.disabled = true;

      // A remembered device skips the code.
      const saved = A.credentials();
      if (saved.token && saved.email === email) {
        const r = await A.call('whoami');
        if (r.ok) { btn.disabled = false; A.saveSession(email, null, r.me); showHome(); return; }
        A.ls.del('token');
      }

      const r = await A.post(window.SHARED_CONFIG.AUTH_API_URL, { action: 'requestCode', email });
      btn.disabled = false;
      if (!r.ok && r.error !== 'cooldown') { errEl.textContent = errText(r); return; }
      pendingEmail = email;
      $('#code-email').textContent = email;
      $('#code').value = '';
      $('#code-error').textContent = r.ok ? '' : errText(r);
      show('code');
    }

    async function submitCode(e) {
      e.preventDefault();
      const code = $('#code').value.trim();
      const errEl = $('#code-error');
      if (!code) { errEl.textContent = 'Nhập mã trong email.'; return; }
      const btn = $('#form-code button[type=submit]');
      btn.disabled = true;
      const r = await A.post(window.SHARED_CONFIG.AUTH_API_URL, {
        action: 'verify', email: pendingEmail, code, device: navigator.userAgent.slice(0, 120),
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      });
      btn.disabled = false;
      if (!r.ok) { errEl.textContent = errText(r); return; }
      A.saveSession(pendingEmail, r.token, r.me);
      showHome();
    }

    $('#btn-accept').addEventListener('click', () => { A.ls.set('accepted', '1'); showEmail(); });
    $('#form-email').addEventListener('submit', submitEmail);
    $('#form-code').addEventListener('submit', submitCode);
    $('#btn-resend').addEventListener('click', async () => {
      const r = await A.post(window.SHARED_CONFIG.AUTH_API_URL, { action: 'requestCode', email: pendingEmail });
      $('#code-error').textContent = r.ok ? '' : errText(r);
      if (r.ok) toast('Mã mới đang trên đường tới.');
    });
    $('#btn-other-email').addEventListener('click', () => { A.ls.del('email'); A.ls.del('token'); showEmail(); });
    $('#btn-signout').addEventListener('click', async () => {
      await A.call('signOut');
      A.ls.del('token');
      A.ss.del('confirmed');
      showEmail('Đã đăng xuất trên thiết bị này. Email vẫn được giữ lại để lần sau đăng nhập nhanh hơn.');
    });

    $('#invite-title').textContent = C.INVITE_TITLE;
    $('#invite-text').textContent = C.INVITE_TEXT;
    $('#btn-accept').textContent = C.INVITE_BUTTON;
    if (A.DEMO) { $('#preview-banner').hidden = false; document.body.classList.add('is-preview'); }

    if (A.hasSession() && A.confirmed()) showHome();
    else if (!A.ls.get('accepted') && !A.ls.get('email')) show('invite');
    else showEmail();
  })();
  </script>
</body>
</html>
